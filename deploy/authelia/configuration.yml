server:
  address: 'tcp://:9091/authelia'
  disable_healthcheck: true

log:
  level: info

identity_validation:
  reset_password:
    jwt_lifespan: '5m'

totp:
  disable: false
  issuer: 'Agent Operations Center'
  algorithm: 'sha1'
  digits: 6
  period: 30
  skew: 1
  secret_size: 32
  disable_reuse_security_policy: false

webauthn:
  disable: false
  display_name: 'Agent Operations Center'
  enable_passkey_login: true

authentication_backend:
  file:
    path: '/config/users_database.yml'
    watch: false
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

access_control:
  default_policy: deny
  rules:
    - domain: 'agents.paterski.com'
      policy: two_factor
      subject:
        - 'group:ceo'

session:
  name: 'aoc_session'
  same_site: 'lax'
  inactivity: '15m'
  expiration: '8h'
  remember_me: '7d'
  cookies:
    - domain: 'agents.paterski.com'
      authelia_url: 'https://agents.paterski.com/authelia'
      default_redirection_url: 'https://agents.paterski.com/'

regulation:
  max_retries: 5
  find_time: '15m'
  ban_time: '1h'

storage:
  local:
    path: '/var/lib/authelia/db.sqlite3'

notifier:
  disable_startup_check: true
  filesystem:
    filename: '/var/lib/authelia/notification.txt'
